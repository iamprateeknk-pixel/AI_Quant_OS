name: AI Quant OS checks

on:
  push:
  pull_request:

jobs:
  locked-application:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            profile: linux
          - os: windows-latest
            profile: windows
    env:
      AI_QUANT_REQUIRE_LOCAL_WEB: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements/locking-tool.lock'
      - run: python scripts/lock_dependencies.py --platform ${{ matrix.profile }} --check
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements/${{ matrix.profile }}-py311.lock'
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - if: ${{ matrix.profile == 'linux' }}
        name: Install pinned Linux OpenTelemetry Collector
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$GITHUB_WORKSPACE/data-local/tools/otelcol-contrib-0.162.0"
          mkdir -p "$tool_dir"
          archive="$RUNNER_TEMP/otelcol-contrib_0.162.0_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --retry-delay 2 --max-time 180 \
            'https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.162.0/otelcol-contrib_0.162.0_linux_amd64.tar.gz' \
            --output "$archive"
          printf '%s  %s\n' \
            'fcc063749f730f8c21fe29f2d340ff174f5f1c5885bd3156fb6c985a3036fcc3' "$archive" \
            | sha256sum --check --status
          test "$(stat --format=%s "$archive")" = '112285869'
          tar -xzf "$archive" -C "$tool_dir"
          binary="$tool_dir/otelcol-contrib"
          test -f "$binary"
          chmod 0755 "$binary"
          printf '%s  %s\n' \
            '2425bdf5f89042cd71f56cf5a66b41681d340cbe14c0b1899bcfe2a3a685a064' "$binary" \
            | sha256sum --check --status
          printf 'AI_QUANT_NATIVE_COLLECTOR_EXE=%s\n' "$binary" >> "$GITHUB_ENV"
      - if: ${{ matrix.profile == 'windows' }}
        run: npx playwright install chromium
        working-directory: apps/web
      - if: ${{ matrix.profile == 'windows' }}
        run: npm run visual:regression
        working-directory: apps/web
      - if: ${{ matrix.profile == 'windows' }}
        name: Install pinned Alertmanager for webhook configuration acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolDirectory = Join-Path $env:GITHUB_WORKSPACE 'data-local/tools/alertmanager-0.35.0'
          $archive = Join-Path $env:RUNNER_TEMP 'alertmanager-0.35.0.windows-amd64.zip'
          Invoke-WebRequest `
            -Uri 'https://github.com/prometheus/alertmanager/releases/download/v0.35.0/alertmanager-0.35.0.windows-amd64.zip' `
            -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne 43531739) { throw 'Alertmanager archive size differs from the pinned manifest' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'cdf8cd664889bf3f27771881e10814f3d5916310aba90717b4424deb358b0fa3') { throw 'Alertmanager archive digest differs from the pinned manifest' }
          New-Item -ItemType Directory -Path $toolDirectory -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          $executable = Join-Path $env:RUNNER_TEMP 'alertmanager-0.35.0.windows-amd64/alertmanager.exe'
          if ((Get-Item -LiteralPath $executable).Length -ne 55130112) { throw 'Alertmanager executable size differs from the pinned manifest' }
          if ((Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant() -ne '313a07892a709bd96f8770266bec6ec85c46c21350d582f5cfc8d80b04cf7b69') { throw 'Alertmanager executable digest differs from the pinned manifest' }
          Copy-Item -LiteralPath $executable -Destination (Join-Path $toolDirectory 'alertmanager.exe')
      - run: python -m pytest -q
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git -v --redact=100 --no-banner --log-opts="--all" /repo
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,data,trading,recovery,observability]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npm run build
  nautilus:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,trading]"
      - run: python -c "import nautilus_trader; assert nautilus_trader.__version__ == '1.221.0'"
      - run: python -m pytest -q tests/test_nautilus_runtime.py tests/test_nautilus_ticks.py tests/test_nautilus_directional.py tests/test_native_portfolio.py tests/test_directional_research.py tests/test_strategy_samples.py tests/test_strategy_registry.py tests/test_research_pipeline.py tests/test_monte_carlo.py tests/test_research_adversarial.py tests/test_research_candidates.py tests/test_research_api.py tests/test_counterfactual.py tests/test_shadow_portfolio.py
  repair-candidates:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_repair_workspace.py tests/test_repair_cli.py tests/test_repair_sandbox.py tests/test_repair_transport.py tests/test_repair_containers.py tests/test_repair_cleanup.py tests/test_repair_removals.py tests/test_repair_locks.py tests/test_repair_snapshots.py tests/test_repair_jobs.py tests/test_repair_staging.py tests/test_repair_image_inputs.py tests/test_repair_image_archive.py tests/test_repair_image_verification.py tests/test_repair_image_loading.py tests/test_repair_replay.py tests/test_health_store.py
  agent-evolution:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_agent_genomes.py tests/test_evolution_protocols.py tests/test_evolution_cli.py tests/test_agent_registry.py
  local-application:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      AI_QUANT_REQUIRE_LOCAL_WEB: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: python -m pytest -q tests/test_local_runtime.py tests/test_local_cli.py tests/test_local_application.py tests/test_repair_locks.py
  temporal-recovery:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      AI_QUANT_REQUIRE_TEMPORAL: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,recovery]"
      - run: python -c "from importlib.metadata import version; assert version('temporalio') == '1.34.0'"
      - name: Install checksum-pinned Temporal CLI
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP 'quant-temporal'
          New-Item -ItemType Directory -Path $toolDir -Force | Out-Null
          if ($IsWindows) {
            $archiveName = 'temporal_cli_1.9.1_windows_amd64.zip'
            $expected = 'babb65844835045c91fb98930fe10b81de28db80c8c609180473d2c0b18c7589'
            $binaryName = 'temporal.exe'
          } else {
            $archiveName = 'temporal_cli_1.9.1_linux_amd64.tar.gz'
            $expected = '09a0326a51db84d02735e53542b9ebd8c4758daf47482a9ab0abce15844e60d5'
            $binaryName = 'temporal'
          }
          $archivePath = Join-Path $toolDir $archiveName
          Invoke-WebRequest "https://github.com/temporalio/cli/releases/download/v1.9.1/$archiveName" -OutFile $archivePath
          if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Temporal archive checksum mismatch'
          }
          if ($IsWindows) {
            Expand-Archive -LiteralPath $archivePath -DestinationPath $toolDir
          } else {
            tar -xzf $archivePath -C $toolDir
            if ($LASTEXITCODE -ne 0) { throw 'Temporal archive extraction failed' }
          }
          $binaryPath = Join-Path $toolDir $binaryName
          & $binaryPath --version
          if ($LASTEXITCODE -ne 0) { throw 'Temporal CLI verification failed' }
          "AI_QUANT_TEMPORAL_CLI=$binaryPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python -m pytest -q tests/test_paper_recovery.py tests/test_temporal_recovery.py tests/test_recovery_api.py tests/test_temporal_recovery_api.py
  data-integration:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,data]"
      - run: python scripts/start_data_stack.py
      - run: python scripts/check_data_stack.py
      - if: always()
        run: |
          if test -f .local-stack.env; then
            python scripts/start_data_stack.py stop
          fi
  minio-archive-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,data]"
      - run: docker compose -f compose.minio.yaml up -d
      - name: Wait for MinIO and create test bucket
        run: |
          python - <<'PY'
          import time
          import boto3
          from botocore.exceptions import BotoCoreError, ClientError

          client = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:58000",
              region_name="us-east-1",
              aws_access_key_id="quant-test",
              aws_secret_access_key="local-test-only-secret",
          )
          deadline = time.monotonic() + 90
          while True:
              try:
                  client.create_bucket(Bucket="quant-archives")
                  break
              except ClientError as error:
                  if error.response["Error"]["Code"] in {"BucketAlreadyOwnedByYou", "BucketAlreadyExists"}:
                      break
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(2)
              except BotoCoreError:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(2)
          PY
      - name: Verify archive upload, immutable writes, restore, and replay
        env:
          P02_TEST_S3_ENDPOINT: http://127.0.0.1:58000
          P02_TEST_S3_ACCESS_KEY: quant-test
          P02_TEST_S3_SECRET_KEY: local-test-only-secret
          P02_TEST_S3_BUCKET: quant-archives
        run: python -m pytest -q tests/test_s3_http.py
      - if: always()
        run: docker compose -f compose.minio.yaml down -v
