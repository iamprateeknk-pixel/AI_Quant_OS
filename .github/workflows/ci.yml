name: AI Quant OS checks

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git -v --redact=100 --no-banner --log-opts="--all" /repo
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,data]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  nautilus:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,trading]"
      - run: python -c "import nautilus_trader; assert nautilus_trader.__version__ == '1.221.0'"
      - run: python -m pytest -q tests/test_nautilus_runtime.py tests/test_nautilus_ticks.py tests/test_strategy_samples.py tests/test_strategy_registry.py tests/test_research_pipeline.py tests/test_monte_carlo.py
  data-integration:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,data]"
      - run: python scripts/start_data_stack.py
      - run: python scripts/check_data_stack.py
      - if: always()
        run: |
          if test -f .local-stack.env; then
            python scripts/start_data_stack.py stop
          fi
