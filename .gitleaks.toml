title = "AI Quant OS secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "The pinned public Valkey image tag is not a credential"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^compose\.data\.yaml$''']
regexTarget = "line"
regexes = ['''^\s*image:\s*valkey/valkey:9\.0\.6-alpine3\.24\s*$''']

[[allowlists]]
description = "Exact public CPython signing-key fingerprint in the pinned official image config"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^infra/repair-worker/base_config\.json$''']
regexTarget = "match"
regexes = ['''^GPG_KEY=A035C8C19219BA821ECEA86B64E628F8D684696D"$''']

[[allowlists]]
description = "Exact retained A06 event HTTP source SHA-256, verified against source bytes"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^docs/evaluations/event-baseline\.json$''']
regexTarget = "line"
regexes = ['''^\s*"event_feed_api\.py": "b08e5c616d4dd9bb1de178b1b0f0939b9d32a1851b6e13bc3d46eb3f208323c6",$''']
