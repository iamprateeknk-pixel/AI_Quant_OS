name: ai-quant-data-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: quant_dev
      POSTGRES_DB: quant_dev
      POSTGRES_PASSWORD: ${AI_QUANT_LOCAL_POSTGRES_PASSWORD:?Set by start_data_stack.py}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./data/migrations/postgres:/migrations:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "quant_dev", "-d", "quant_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.4
    environment:
      CLICKHOUSE_USER: quant_dev
      CLICKHOUSE_PASSWORD: ${AI_QUANT_LOCAL_CLICKHOUSE_PASSWORD:?Set by start_data_stack.py}
      CLICKHOUSE_DB: quant_market
    ports:
      - "127.0.0.1:58123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./data/migrations/clickhouse:/migrations:ro
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query 'SELECT 1' >/dev/null
      interval: 3s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.0.6-alpine3.24
    environment:
      REDISCLI_AUTH: ${AI_QUANT_LOCAL_VALKEY_PASSWORD:?Set by start_data_stack.py}
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${AI_QUANT_LOCAL_VALKEY_PASSWORD:?Set by start_data_stack.py}
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3-emulator:
    image: motoserver/moto:5.2.3
    environment:
      AWS_ACCESS_KEY_ID: ${AI_QUANT_LOCAL_S3_ACCESS_KEY:?Set by start_data_stack.py}
      AWS_SECRET_ACCESS_KEY: ${AI_QUANT_LOCAL_S3_SECRET_KEY:?Set by start_data_stack.py}
    ports:
      - "127.0.0.1:59000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 5000), 2).close()"
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  clickhouse-data:
