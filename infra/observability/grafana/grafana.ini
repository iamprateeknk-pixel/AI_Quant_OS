[server]
http_addr = 127.0.0.1
http_port = 3100
domain = 127.0.0.1
enforce_domain = true
read_timeout = 10

[security]
admin_user = paper-operator
admin_password = $__file{operator-admin-password}
secret_key = $__file{operator-secret-key}
disable_gravatar = true
allow_embedding = false
cookie_samesite = strict

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true
password_policy = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true
preinstall_auto_update = false
plugin_admin_enabled = false
public_key_retrieval_disabled = true
disable_sanitize_html = false
disable_plugins = grafana-postgresql-datasource,zipkin,loki,opentsdb,mssql,mysql,stackdriver,grafana-pyroscope-datasource,jaeger,elasticsearch,tempo,influxdb

[news]
news_feed_enabled = false

[live]
max_connections = 0

[unified_alerting]
enabled = false

[log]
mode = file
level = warn
