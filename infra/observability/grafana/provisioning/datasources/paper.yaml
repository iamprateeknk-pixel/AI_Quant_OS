apiVersion: 1
datasources:
  - name: Paper HTTP Prometheus
    uid: paper-http-source
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      prometheusType: Prometheus
      prometheusVersion: 3.15.0
