[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quant-os"
version = "0.1.0"
description = "Paper-only deterministic trading foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "langgraph==1.2.12", "langgraph-checkpoint-sqlite==3.1.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "hypothesis>=6,<7", "ruff>=0.8,<1", "moto[s3]>=5.1,<6"]
data = ["pyarrow>=25,<26", "psycopg[binary]>=3.2,<4", "boto3>=1.40,<2", "redis>=6,<9"]

[project.scripts]
ai-quant-data = "ai_quant_os.data_cli:main"
ai-quant-evaluate = "ai_quant_os.evaluation_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
