[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quant-os"
version = "0.1.0"
description = "Paper-only deterministic trading foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "langgraph==1.2.12", "langgraph-checkpoint-sqlite==3.1.1", "cryptography==50.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "hypothesis>=6,<7", "ruff==0.15.15", "moto[s3]>=5.1,<6", "installer==0.7.0", "jsonschema[format]>=4,<5"]
data = ["pyarrow>=25,<26", "psycopg[binary]>=3.2,<4", "boto3>=1.40,<2", "redis>=6,<9"]
trading = ["nautilus_trader==1.221.0"]
recovery = ["temporalio==1.34.0"]
observability = ["opentelemetry-sdk==1.45.0", "opentelemetry-exporter-otlp-proto-common==1.45.0"]

[project.scripts]
ai-quant-data = "ai_quant_os.data_cli:main"
ai-quant-evaluate = "ai_quant_os.evaluation_cli:main"
ai-quant-backtest = "ai_quant_os.nautilus_cli:main"
ai-quant-portfolio-backtest = "ai_quant_os.portfolio_backtest_cli:main"
ai-quant-tick-portfolio-backtest = "ai_quant_os.tick_portfolio_cli:main"
ai-quant-research = "ai_quant_os.research_cli:main"
ai-quant-research-data = "ai_quant_os.research_data_cli:main"
ai-quant-candidates = "ai_quant_os.candidate_cli:main"
ai-quant-counterfactual = "ai_quant_os.counterfactual_cli:main"
ai-quant-shadow = "ai_quant_os.shadow_cli:main"
ai-quant-repair = "ai_quant_os.repair_cli:main"
ai-quant-evolve = "ai_quant_os.evolution_cli:main"
ai-quant-local = "ai_quant_os.local_cli:main"
ai-quant-demo-sync = "ai_quant_os.mt5_sync_service:main"
ai-quant-demo-checkpoint = "ai_quant_os.mt5_sync_checkpoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_quant_os = ["strategy_manifests.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
